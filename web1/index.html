<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جعبه ابزار فرکانس</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-animation"></div>

    <!-- داشبورد -->
    <div id="dashboard" class="screen active">
        <header class="dash-header">
            <div class="spacer"></div>
            <h1 class="glow-text-cyan">جعبه ابزار فرکانس</h1>
            <button class="info-btn" onclick="alert('توسعه دهنده: آرمان حنانی\nنسخه وب (PWA)')"><i class="fas fa-info"></i></button>
        </header>

        <div class="grid-container">
            <div class="neon-card full-width" data-tool="insect" data-title="دافع حشرات" style="--neon-color: #FF3366;">
                <i class="fas fa-mosquito"></i><span>دافع حشرات</span>
            </div>
            <div class="neon-card" data-tool="speaker" data-title="پاک‌کننده اسپیکر" style="--neon-color: #00FFFF;">
                <i class="fas fa-volume-up"></i><span>پاک‌کننده اسپیکر</span>
            </div>
            <div class="neon-card" data-tool="dog" data-title="سوت سگ و گربه" style="--neon-color: #FF9900;">
                <i class="fas fa-dog"></i><span>سوت سگ و گربه</span>
            </div>
            <div class="neon-card" data-tool="generator" data-title="ژنراتور آزاد" style="--neon-color: #FFFFFF;">
                <i class="fas fa-wave-square"></i><span>ژنراتور آزاد</span>
            </div>
            <!-- ابزارهای مرحله بعد -->
            <div class="neon-card" data-tool="hearing" data-title="تست شنوایی" style="--neon-color: #3366FF;">
                <i class="fas fa-ear-listen"></i><span>تست شنوایی</span>
            </div>
            <div class="neon-card" data-tool="detector" data-title="تشخیص فرکانس" style="--neon-color: #9933FF;">
                <i class="fas fa-microphone"></i><span>تشخیص فرکانس</span>
            </div>
        </div>
    </div>

    <!-- صفحه ابزارها -->
    <div id="tool-view" class="screen">
        <header class="tool-header">
            <button id="back-btn"><i class="fas fa-arrow-right"></i></button>
            <h2 id="tool-title" class="glow-text-cyan">عنوان ابزار</h2>
            <button class="help-btn"><i class="fas fa-question-circle"></i></button>
        </header>
        <div class="hud-glow-line"></div>

        <div id="tool-content">
            
            <!-- 1. ژنراتور آزاد -->
            <div id="ui-generator" class="tool-ui hidden">
                <div class="freq-display" id="gen-freq-display" style="--active-color: #FFFFFF;">440 Hz</div>
                <input type="range" id="gen-slider" class="neon-slider" min="0" max="1000" value="500">
                <div class="wave-grid">
                    <button class="wave-btn active" data-wave="sine">Sine</button>
                    <button class="wave-btn" data-wave="square">Square</button>
                    <button class="wave-btn" data-wave="sawtooth">Saw</button>
                    <button class="wave-btn" data-wave="triangle">Triangle</button>
                </div>
                <button class="play-btn" id="gen-play-btn" style="--active-color: #FFFFFF;">پخش فرکانس</button>
            </div>

            <!-- 2. دافع حشرات -->
            <div id="ui-insect" class="tool-ui hidden">
                <div class="status-text" id="insect-status">آماده پخش</div>
                <div class="preset-grid">
                    <button class="preset-btn" data-freq="17000">پشه<br><span>17 kHz</span></button>
                    <button class="preset-btn" data-freq="15000">مگس<br><span>15 kHz</span></button>
                    <button class="preset-btn" data-freq="14000">کک و کنه<br><span>14 kHz</span></button>
                    <button class="preset-btn" data-freq="20000">موش<br><span>20 kHz</span></button>
                    <button class="preset-btn full-width" data-sweep="true">موج متغیر (پیشنهادی)<br><span>15 - 20 kHz</span></button>
                </div>
                <button class="play-btn" id="insect-play-btn" style="--active-color: #FF3366;">پخش</button>
            </div>

            <!-- 3. سوت سگ -->
            <div id="ui-dog" class="tool-ui hidden">
                <div class="status-text" id="dog-status">آماده پخش</div>
                <div class="preset-grid">
                    <button class="preset-btn" data-freq="22000">سگ (جلب توجه)<br><span>22 kHz</span></button>
                    <button class="preset-btn" data-freq="25000">سگ (توقف پارس)<br><span>25 kHz</span></button>
                    <button class="preset-btn" data-freq="24000">گربه (فراخوان)<br><span>24 kHz</span></button>
                    <button class="preset-btn" data-freq="20000">گربه (بازدارنده)<br><span>20 kHz</span></button>
                </div>
                <button class="play-btn" id="dog-play-btn" style="--active-color: #FF9900;">پخش</button>
            </div>

            <!-- 4. پاک‌کننده اسپیکر -->
            <div id="ui-speaker" class="tool-ui hidden">
                <div class="status-text" id="speaker-status" style="color: #00FFFF;">ولوم را روی حداکثر قرار دهید</div>
                <div class="preset-grid">
                    <button class="preset-btn full-width" data-mode="deep">لرزش عمیق<br><span>165 Hz</span></button>
                    <button class="preset-btn full-width" data-mode="sweep">موج متغیر<br><span>100 - 250 Hz</span></button>
                    <button class="preset-btn full-width" data-mode="shock">شوک ضربه‌ای<br><span>پالس 165 Hz</span></button>
                </div>
                <button class="play-btn" id="speaker-play-btn" style="--active-color: #00FFFF;">شروع پاک‌سازی</button>
            </div>

            <!-- پیام برای ابزارهای در حال ساخت -->
            <div id="ui-placeholder" class="tool-ui hidden">
                <div class="placeholder">
                    <i class="fas fa-tools" style="font-size: 40px; color: #555; margin-bottom: 15px;"></i>
                    <p>این ابزار در مرحله بعدی اضافه خواهد شد.</p>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
